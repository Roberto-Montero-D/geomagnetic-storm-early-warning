# Geomagnetic Storm Early Warning System
# Central Project Configuration
# Protocol: MASTER_PROTOCOL_v1.2
# Protocol status: Frozen / Phase 0 Amendment
# The master protocol is the source of truth.

project:
  name: "Geomagnetic Storm Early Warning System"
  protocol_version: "1.2"
  protocol_status: "frozen"

target:
  T: 5
  H: 6

event:
  Z: 6

alert:
  C: 3

operational:
  max_FAR_per_day: 0.2

temporal:
  information_cutoff: "t - 1h"

  omni:
    raw_timestamp_represents: "period_start"
    period_duration_hours: 1
    period_end_rule: "raw_timestamp + 1h"
    eligibility_rule: "period_end <= t - 1h"
    timestamp_convention_verified: true

  kp:
    source_resolution_hours: 3
    raw_encoding: "Kp_x10"
    repeated_hourly_in_omni: true
    availability_method: "completed_interval_asof"
    asof_rule: "interval_end <= query_time"
    lags_hours: [1, 3, 6, 12, 24]
    historical_nowcast_reconstructed: false
    availability_policy_verified: true

geomagnetic_indices:
  ae:
    ingest_raw: true
    primary_causal_feature: false
    exclusion_reason: "retrospective product version not demonstrably available at historical prediction time"
  dst:
    ingest_raw: true
    primary_causal_feature: false
    exclusion_reason: "retrospective product version not demonstrably available at historical prediction time"

splits:
  initial_train: {start_year: 1996, end_year: 2016}
  validation_1: {start_year: 2017, end_year: 2018}
  train_2: {start_year: 1996, end_year: 2018}
  validation_2: {start_year: 2019, end_year: 2020}
  train_3: {start_year: 1996, end_year: 2020}
  validation_3: {start_year: 2021, end_year: 2021}
  final_test: {start_year: 2022, end_year: 2025}

features:
  layers: [raw, rolling, persistence, dynamics, cme, interactions]
  raw_primary:
    - bz_gsm
    - bt
    - speed
    - density
    - flow_pressure
    - kp_lag_1h
    - kp_lag_3h
    - kp_lag_6h
    - kp_lag_12h
    - kp_lag_24h
  raw_ingested_but_excluded_from_primary: [ae, dst]

models:
  baselines: [persistence, physical, logistic, ExtraTrees]
  candidates: [ExtraTrees, LightGBM, XGBoost]

imbalance:
  strategies:
    - {name: none}
    - name: class_weighting
      pos_weight: [1, 3, 5, 10, 20, 50]
    - name: random_undersampling
      ratio: ["10:1", "5:1", "2:1"]
    - name: smote
      k: [3, 5, 7]
    - name: borderline_smote
      k: [3, 5, 7]
    - {name: smote_enn}

model_selection:
  ExtraTrees:
    n_estimators: [100, 200, 500]
    max_depth: [10, 20, null]
  LightGBM:
    learning_rate: [0.01, 0.05, 0.1]
    num_leaves: [31, 63, 127]
  XGBoost:
    learning_rate: [0.01, 0.05, 0.1]
    max_depth: [3, 6, 9]

threshold_selection:
  method: "global_oof"
  minimum: 0.01
  maximum: 0.99
  step: 0.01
  selection_constraint: "FAR/day <= 0.2"

threshold_stability:
  far_per_day_min: 0.15
  far_per_day_max: 0.20

phase_7:
  # Generalization experiments for the frozen primary system; not independently re-optimized tracks.
  experiments:
    - {H: 3, T: 5}
    - {H: 6, T: 5}
    - {H: 12, T: 5}
    - {H: 24, T: 5}
    - {H: 6, T: 6}
    - {H: 6, T: 7}

final_test:
  start_year: 2022
  end_year: 2025
  protected: true
  single_use: true

data_coverage:
  omni:
    start: "1996-01-01 00:00"
    end: "2025-12-31 23:00"
    hourly_rows: 262992
    missing_timestamps: 0
    duplicate_timestamps: 0
  kp:
    canonical_intervals: 87664
    missing_intervals: 0

phase_0:
  omni_timestamp_verified: true
  omni_loader_verified: true
  omni_real_data_smoke_test_passed: true
  kp_timestamp_verified: true
  kp_availability_policy_verified: true
  kp_causality_tests_passing: true
  kp_real_data_smoke_test_passed: true
  ae_availability_audited: true
  dst_availability_audited: true
  ae_dst_primary_exclusion_frozen: true
  cme_availability_verified: false
  temporal_cutoff_tested: false
  event_definition_tested: false
  alert_definition_tested: false
  leakage_tests_passing: false
