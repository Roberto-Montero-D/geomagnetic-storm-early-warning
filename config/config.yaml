# Geomagnetic Storm Early Warning System
# Central Project Configuration
#
# Protocol: MASTER_PROTOCOL_v1.3.md
# Protocol status: Frozen / Phase 0.3 Amendment
# -------------------------------------------------------------------

project:
  name: "Geomagnetic Storm Early Warning System"
  protocol_version: "1.3"
  protocol_status: "frozen"

target:
  T: 5
  H: 6
  canonical_name: "y_event"
  semantic_type: "future_storm_condition"
  window: "(t, t+H]"
  current_time_included: false
  horizon_endpoint_included: true
  retrospective_ground_truth: true
  positive_rule: "any observed future hourly Kp >= T"
  negative_rule: "all H future hourly Kp states observed and < T"
  unknown_rule: "no observed positive and one or more future hourly Kp states missing"
  missing_target_value: "NaN"

event:
  Z: 6

alert:
  C: 3

operational:
  max_FAR_per_day: 0.2

temporal:
  latest_allowed_observation: "t - 1h"
  omni_raw_timestamp_semantics: "period_start"
  omni_period_duration_hours: 1
  eligibility_rule: "period_end <= prediction_time - 1h"
  timestamp_convention_verified: true

splits:
  initial_train:
    start_year: 1996
    end_year: 2016
  validation_1:
    start_year: 2017
    end_year: 2018
  train_2:
    start_year: 1996
    end_year: 2018
  validation_2:
    start_year: 2019
    end_year: 2020
  train_3:
    start_year: 1996
    end_year: 2020
  validation_3:
    start_year: 2021
    end_year: 2021
  final_test:
    start_year: 2022
    end_year: 2025

features:
  manifest:
    total_features: 93
    family_order:
      - raw
      - rolling
      - persistence
      - dynamics
      - interactions

    rolling:
      variables:
        - bz_gsm
        - bt
        - speed
        - density
        - flow_pressure
      windows_hours: [3, 6, 12, 24]
      statistics: [mean, min, std]
      std_ddof: 1
      window_semantics: "physical_time"

    persistence:
      bz_lt_nt: [-5, -10, -15]
      speed_gt_km_s: [500, 600]
      semantics: "consecutive_exact_hourly_intervals"

    dynamics:
      delta_hours: [1, 3]
      slope_hours: 3
      slope_method: "OLS over four exact hourly samples spanning 3 elapsed hours"

    interactions:
      - bz_neg_x_speed
      - bz_neg_x_density
      - flow_pressure_x_speed

    missing_data:
      imputation_in_feature_layer: false
      fallback_to_older_raw_timestamp: false

kp:
  raw_encoding: "Kp x 10 integer"
  canonical_interval_hours: 3
  predictor_mapping: "kp_asof"
  rule: "interval_end <= query_time"
  lags_hours: [1, 3, 6, 12, 24]
  target_uses_retrospective_ground_truth: true

geomagnetic_indices:
  ae:
    raw_ingestion: true
    primary_causal_feature: false
  dst:
    raw_ingestion: true
    primary_causal_feature: false

cme:
  source: "SOHO/LASCO CDAW"
  phase_0_3_audited: true
  primary_causal_feature: false
  exclusion_reason: >
    Timestamped LASCO height-time measurements support causal measurement
    reconstruction after a CME candidate is defined, but the retrospectively
    curated CDAW candidate-event universe does not provide uniform historical
    availability semantics across 1996-2025.
  raw_research_access: true
  audit_code_retained: true
  retrospective_analysis_allowed: true
  future_protocol_extension_allowed: true
  final_catalog_predictors_allowed: false
  reconstructed_kinematics_in_primary_allowed: false
  cme_counts_in_primary_allowed: false

data_coverage:
  primary_start_year: 1996
  primary_end_year: 2025

  cme_cdaw_audit:
    successful_yht_records: 42422
    failed_records: 4
    retrospective_insertions: 3410
    provisional_non_inserted_candidates: 39012
    trajectories_ge_2_points: 42346
    trajectories_ge_3_points: 41705
    trajectories_ge_4_points: 39900
    trajectories_ge_5_points: 37394
    fraction_ge_3_points: 0.983098
    c2_only: 14838
    c3_only: 545
    c2_c3: 27039
    duplicate_timestamp_trajectories: 21
    nonmonotonic_trajectories: 17
    invalid_height_trajectories: 0
    third_point_median_hours: 0.408056
    third_point_p75_hours: 0.796667
    third_point_p90_hours: 1.020833
    third_point_p95_hours: 1.4
    fraction_third_point_within_1h: 0.880470
    fraction_third_point_within_3h: 0.993070
    fraction_third_point_within_6h: 0.998945
    fraction_third_point_within_12h: 0.999952
    known_failed_months:
      - "1998-07"
      - "1998-08"
      - "1998-09"
      - "1999-01"

models:
  baselines:
    - persistence
    - physical
    - logistic
    - ExtraTrees

  candidates:
    - ExtraTrees
    - LightGBM
    - XGBoost

imbalance:
  strategies:
    - name: none

    - name: class_weighting
      pos_weight: [1, 3, 5, 10, 20, 50]

    - name: random_undersampling
      ratio: ["10:1", "5:1", "2:1"]

    - name: smote
      k: [3, 5, 7]

    - name: borderline_smote
      k: [3, 5, 7]

    - name: smote_enn

model_selection:
  ExtraTrees:
    n_estimators: [100, 200, 500]
    max_depth: [10, 20, null]

  LightGBM:
    learning_rate: [0.01, 0.05, 0.1]
    num_leaves: [31, 63, 127]

  XGBoost:
    learning_rate: [0.01, 0.05, 0.1]
    max_depth: [3, 6, 9]

threshold_selection:
  method: "global_oof"
  minimum: 0.01
  maximum: 0.99
  step: 0.01
  selection_constraint: "FAR/day <= 0.2"

threshold_stability:
  far_per_day_min: 0.15
  far_per_day_max: 0.20

phase_7:
  source_universe_frozen: true
  experiments:
    - {H: 3, T: 5}
    - {H: 6, T: 5}
    - {H: 12, T: 5}
    - {H: 24, T: 5}
    - {H: 6, T: 6}
    - {H: 6, T: 7}

final_test:
  start_year: 2022
  end_year: 2025
  protected: true
  single_use: true
  source_universe_frozen: true

phase_0:
  omni_timestamp_verified: true
  kp_timestamp_verified: true
  ae_dst_availability_audited: true
  ae_dst_primary_exclusion_frozen: true
  cme_availability_audited: true
  cme_measurement_causality_feasible: true
  cme_candidate_event_causality_sufficient_for_primary: false
  cme_primary_exclusion_frozen: true
  temporal_cutoff_tested: true
  event_definition_tested: true
  alert_definition_tested: true
  leakage_tests_passing: true
  causal_features_implemented: true
  causal_feature_manifest_frozen: true
  causal_feature_count: 93
  causal_feature_tests_passing: true
  target_construction_implemented: true
  target_definition_frozen: true
  target_tests_passing: true
  temporal_integrity_suite_passing: true
  phase_0_complete: true